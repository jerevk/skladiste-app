function itemGroup(mode,item){
 const key=String(item.key||item.item_location_id||'');
 const f=key.match(/^seed-fridge-(\d+)$/);
 if(mode==='fridge'&&f)return FRIDGE_SEED_GROUPS[Number(f[1])]||'Ostalo';
 const g=String(item.group_name||item.group||'Ostalo');
 if(mode==='pica'&&['Jana Vitamin','Senzacija','Okusi'].includes(g))return 'Okusi';
 if(mode==='pica'&&g==='Cedevita')return 'Cedevite';
 if(mode==='pivo'&&g==='Tomislav i Radler')return 'Tomislav + Radler';
 return g;
}
function itemOrder(mode,item){
 const key=String(item.key||item.item_location_id||'');
 const match=key.match(/^seed-(pivo|pica|zesta|toplo|fridge)-(\d+)$/);
 if(match&&match[1]===mode){
  const n=Number(match[2]);
  return mode==='fridge'?(FRIDGE_SEED_POSITION[n]??n+200):n;
 }
 const name=String(item.item_name||item.item||'');

 return idx<0?10000:idx+1;
}
function orderedGroupNames(mode,items){

function orderedItems(mode,items){return [...items].sort((a,b)=>itemOrder(mode,a)-itemOrder(mode,b))}

 const sections=MODES.map(m=>({key:m[0],title:m[1],items:(a.items||[]).filter(i=>i.mode===m[0]).map(i=>({...i,group_name:i.group}))}));
 const usersHtml=users.map(u=>'<div class="line"><div><strong>'+x(u.name)+'</strong><div class="sub">'+x(u.role)+'</div></div><div class="tools">'+(u.role==='ADMIN'?'':'<button class="soft editUser" data-id="'+x(u.id)+'">Uredi</button><button class="soft delUser" data-id="'+x(u.id)+'">Ukloni</button>')+'</div></div>').join('');
 const productsHtml=groupedCatalogHTML(sections,(it)=>'<div class="line adminLine" data-name="'+x((it.item+' '+it.group).toLocaleLowerCase('hr'))+'"><div><strong>'+x(it.item)+'</strong><div class="sub">'+x(it.group)+(it.mode==='fridge'?' · Pun '+x(it.capacity??0):' · '+(Number(it.price)||0).toFixed(2)+' €')+'</div></div><div class="tools"><button class="soft editItem" data-key="'+x(it.key)+'">Uredi</button>'+(it.mode==='fridge'?'<button class="soft capacityItem" data-key="'+x(it.key)+'">Kapacitet</button>':'<button class="soft priceItem" data-key="'+x(it.key)+'">Cijena</button>')+'<button class="soft delItem" data-key="'+x(it.key)+'">Ukloni</button></div></div>');
 shell('<div class="grid"><section class="panel"><h2>Konobari</h2><div class="mini">'+usersHtml+'</div><h3 class="groupTitle">Dodaj konobara</h3><form id="newUser" class="stack"><input id="newUserName" required placeholder="Ime konobara"><input id="newUserPin" required type="password" inputmode="numeric" minlength="4" maxlength="8" placeholder="PIN (4–8 znamenki)"><button class="primary">Dodaj konobara</button></form></section><section class="panel"><div class="panelTop"><h2>Artikli i frižider</h2><span class="chip">'+(a.items||[]).length+' aktivnih</span></div><p class="hint">Artikl dodan u grupu automatski ulazi u njezin obračun. Kapacitet punog frižidera uređuješ zasebno, a rupe možeš mijenjati u odjeljku Rupe u frižideru.</p><button id="adminFridgeHoles" class="soft">Uredi rupe u frižideru</button><input id="adminSearch" class="search" placeholder="Pretraži artikle i grupe" style="margin-top:12px"><div id="adminItems" class="mini">'+productsHtml+'</div><h3 class="groupTitle">Dodaj artikl</h3><form id="newItem" class="stack"><label class="field">Kategorija<select id="newItemMode">'+MODES.map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select></label><label class="field">Grupa<select id="newItemGroup"></select></label><label class="field">Naziv artikla<input id="newItemName" required placeholder="Npr. novo pivo"></label><label class="field" id="newPriceWrap">Cijena (€)<input id="newItemPrice" type="number" step="0.01" min="0" value="0"></label><label class="field" id="newCapacityWrap" style="display:none">Koliko stane u pun frižider<input id="newItemCapacity" type="number" step="1" min="1" value="24"></label><button class="primary">Dodaj artikl</button></form></section></div>','Administracija');
 const updateFields=()=>{const mode=$('newItemMode').value;$('newItemGroup').innerHTML=adminGroupOptions(mode);$('newPriceWrap').style.display=mode==='fridge'?'none':'grid';$('newCapacityWrap').style.display=mode==='fridge'?'grid':'none'};
 updateFields();$('newItemMode').onchange=updateFields;
 $('adminFridgeHoles').onclick=()=>{state.mode='fridge';openPage('count')};
 $('newUser').onsubmit=async e=>{e.preventDefault();try{await run('appAdminAddUser',state.token,$('newUserName').value,$('newUserPin').value);toast('Konobar dodan.');admin()}catch(e){toast(e.message)}};
 $('newItem').onsubmit=async e=>{e.preventDefault();const mode=$('newItemMode').value;try{await run('appAdminAddItem',state.token,{mode,group:$('newItemGroup').value,item:$('newItemName').value,price:mode==='fridge'?0:$('newItemPrice').value,capacity:mode==='fridge'?$('newItemCapacity').value:undefined});toast('Artikl dodan u odabranu grupu.');admin()}catch(e){toast(e.message)}};
 document.querySelectorAll('.editUser').forEach(b=>b.onclick=async()=>{const u=users.find(i=>i.id===b.dataset.id);if(!u)return;const name=prompt('Ime konobara',u.name);if(name===null)return;if(!name.trim())return toast('Ime nije uneseno.');const pin=prompt('Novi PIN (ostavi prazno ako ostaje isti)','');if(pin===null)return;try{await run('appAdminEditUser',state.token,u.id,name,pin);toast('Konobar ažuriran.');admin()}catch(e){toast(e.message)}});
 document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{if(!confirm('Ukloniti konobara?'))return;try{await run('appAdminDeleteUser',state.token,b.dataset.id);admin()}catch(e){toast(e.message)}});
 document.querySelectorAll('.editItem').forEach(b=>b.onclick=async()=>{const it=(a.items||[]).find(i=>i.key===b.dataset.key);if(!it)return;const name=prompt('Naziv artikla',it.item);if(name===null)return;const list=(ADMIN_GROUPS[it.mode]||[]).map((g,i)=>(i+1)+'. '+g[1]).join('\n');const choice=prompt('Odaberi broj grupe:\n'+list, String(Math.max(1,(ADMIN_GROUPS[it.mode]||[]).findIndex(g=>g[0]===it.group)+1)));if(choice===null)return;const group=(ADMIN_GROUPS[it.mode]||[])[Number(choice)-1]?.[0];if(!group)return toast('Odaberi postojeću grupu.');try{await run('appAdminRenameItem',state.token,it.key,group,name);toast('Artikl ažuriran.');admin()}catch(e){toast(e.message)}});
 document.querySelectorAll('.priceItem').forEach(b=>b.onclick=async()=>{const it=(a.items||[]).find(i=>i.key===b.dataset.key);if(!it)return;const raw=prompt('Jedinična cijena (€) za '+it.item,String(it.price??0));if(raw===null)return;try{await run('appAdminSetItemPrice',state.token,it.key,raw);toast('Cijena spremljena.');admin()}catch(e){toast(e.message)}});
 document.querySelectorAll('.capacityItem').forEach(b=>b.onclick=async()=>{const it=(a.items||[]).find(i=>i.key===b.dataset.key);if(!it)return;const raw=prompt('Broj boca u punom frižideru: '+it.item,String(it.capacity??24));if(raw===null)return;const n=Number(raw.replace(',','.'));if(!Number.isInteger(n)||n<1)return toast('Upiši pozitivan cijeli broj.');try{await run('appAdminSetFridgeCapacity',state.token,it.key,n);toast('Kapacitet spremljen. Broj rupa ostao je isti.');admin()}catch(e){toast(e.message)}});
 document.querySelectorAll('.delItem').forEach(b=>b.onclick=async()=>{if(!confirm('Deaktivirati artikl?'))return;try{await run('appAdminDeleteItem',state.token,b.dataset.key);admin()}catch(e){toast(e.message)}});
 $('adminSearch').oninput=()=>filterGroupedRows('adminSearch','adminLine');
}
function exportCSV(rows,head){const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='skladiste-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
loginView();if(!demo)setInterval(()=>{if(state.user&&state.page==='home'&&!state.busy&&document.visibilityState==='visible')home().catch(()=>{})},30000);
</script></body></html>
