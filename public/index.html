async function call(fn,...args){if(demo)return mock(fn,...args);const r=await fetch('/api/'+fn,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({args})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Pogreška poslužitelja');return data}
function mock(fn,...args){if(fn==='appPublicConfig')return{users:[{id:'demo',name:'Demo korisnik'}]};if(fn==='appLogin')return{token:'demo',waiter:{id:'demo',name:'Demo korisnik',role:'ADMIN'}};if(fn==='appBootstrap')return{waiter:state.user};if(fn==='appGetCount'){const m=args[1];return{rows:(DEMO_ITEMS[m]||[]).map(([name,qty],i)=>({item_location_id:String(i),group_name:m==='fridge'?'Hladnjak':m.toUpperCase(),item_name:name,current_qty:qty,count_mode:m==='fridge'?'holes':'quantity',full_capacity:m==='fridge'?24:null}))}}if(fn==='appGetCatalog')return{sections:MODES.slice(0,4).map(([k,v])=>({key:k,title:v,items:(DEMO_ITEMS[k]||[]).map(([n,q],i)=>({key:k+':'+i,mode:k,group_name:v,item_name:n,current_qty:q}))}))};if(fn==='appGetTotalState')return{values:[['Artikl','Količina'],...Object.values(DEMO_ITEMS).flat().map(a=>a)]};if(fn==='appGetBackups')return{backups:[],comparison:null};if(fn==='appRecentIncoming'||fn==='appRecentSupply')return[];if(fn==='appAdminGetData')return{users:[{id:'demo',name:'Demo korisnik',role:'ADMIN',active:true}],items:[]};if(fn==='appSaveCount'){const m=args[1],entries=args[2];entries.forEach(e=>{let row=DEMO_ITEMS[m]?.[Number(e.key)];if(row)row[1]=Number(e.value)});return{saved:entries.length}}if(fn==='appSaveIncoming'||fn==='appCreateSupply')return{saved:args[1].length};if(fn==='appAdminAddUser'||fn==='appAdminDeleteUser'||fn==='appAdminAddItem'||fn==='appAdminDeleteItem')return mock('appAdminGetData');return true}
async function run(fn,...args){try{state.busy=true;const res=await call(fn,...args);return res}catch(err){toast('Greška: '+err.message);throw err}finally{state.busy=false}}
function shell(content,title,overline='SKLADIŠNA EVIDENCIJA'){

const links=nav.map(([id,label])=>'<button class="'+(id===state.page?'sel':'')+'" data-page="'+id+'">'+x(id==='home'?'Ukupno':label)+'</button>').join('');

}
async function loginView(){if(demo){state.user={id:'demo',name:'Demo korisnik',role:'ADMIN'};state.token='demo';return openPage('home')} $('root').innerHTML='<div class="loginWrap"><div class="loginCard"><div class="logo">▦</div><h1>Prijava u skladište</h1><p>Odaberi korisnika i upiši osobni PIN.</p><form id="loginForm" class="stack"><label class="field">Zaposlenik<select id="loginUser" required><option>Učitavanje...</option></select></label><label class="field">PIN<input id="loginPin" type="password" inputmode="numeric" autocomplete="off" required placeholder="••••"></label><button class="primary">Prijavi se</button></form></div></div>';try{const config=await run('appPublicConfig');if(!config.users.length){$('root').innerHTML='<div class="loginWrap"><div class="loginCard"><div class="logo">▦</div><h1>Prvo postavljanje</h1><p>Otvori aplikaciju za samostalan rad. Za početak je potreban ključ SETUP_KEY spremljen kao Cloudflare secret.</p><form class="stack" id="setupForm"><label class="field">Ime administratora<input id="setupName" required value="Administrator"></label><label class="field">Početni ključ<input id="setupKey" type="password" required autocomplete="off"></label><label class="field">Administratorski PIN (6–12 znamenki)<input id="setupPin" type="password" minlength="6" maxlength="12" inputmode="numeric" required></label><button class="primary">Postavi aplikaciju</button></form><p class="notice">Ključ za postavljanje nikad se ne sprema u pregledniku.</p></div></div>';$('setupForm').onsubmit=async e=>{e.preventDefault();try{await run('appSetup',$('setupKey').value,$('setupName').value,$('setupPin').value);toast('Administrator je postavljen. Sada se prijavi.');loginView()}catch{}};return;}$('loginUser').innerHTML=config.users.map(u=>'<option value="'+x(u.id)+'">'+x(u.name)+'</option>').join('');$('loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await run('appLogin',$('loginUser').value,$('loginPin').value);state.token=r.token;state.user=r.waiter;openPage('home')}catch{}}}catch{}}
async function openPage(page){state.page=page;try{if(page==='home')await home();if(page==='count')await count();if(page==='supply')await goods('supply');if(page==='incoming')await goods('incoming');if(page==='total')await total();if(page==='backups')await backups();if(page==='order')await orderList();if(page==='admin')await admin()}catch(e){if(/sesija|session/i.test(e.message))loginView()}}
function overviewRows(){return MODES.slice(0,4).flatMap(([k,label])=>(DEMO_ITEMS[k]||[]).map(([name,qty])=>({name,qty,section:label})))}
async function home(){
const catalog=await run('appGetCatalog',state.token);state.catalog=catalog;
const fr=await run('appGetCount',state.token,'fridge');

const fridge=(fr.rows||[]);let textSearch='';
const stock=sections.flatMap(sec=>sec.items);

const sum=arr=>arr.reduce((n,i)=>n+(Number(i.current_qty)||0),0);
const fridgeFull=fridge.reduce((n,i)=>n+(i.full_capacity==null?0:Math.max(0,Number(i.full_capacity)-Number(i.current_qty||0))),0);
const fridgeHoles=fridge.reduce((n,i)=>n+Number(i.current_qty||0),0);

const kpiHtml='<div class="scriptKpis">'+kpis.map(v=>'<div class="scriptKpi"><small>'+x(v[0])+'</small><strong>'+x(v[1])+'</strong></div>').join('')+'</div>';
shell('<div class="scriptHead"><div><h1>Ukupno</h1><div class="sub">Trenutno stanje robe u skladištu</div></div><div class="scriptActions"><button id="openAll">Otvori sve</button><button id="closeAll">Zatvori sve</button><button id="exportCatalog">↓ CSV</button></div></div>'+kpiHtml+'<input id="scriptSearch" class="scriptSearch" placeholder="Traži artikl ili grupu..."><div id="scriptTree" class="scriptTree"></div><div class="scriptNotice" style="margin-top:14px">Frižider se prikazuje odvojeno; rupe su prazna mjesta, a ne pune boce.</div>','Ukupno');
function renderTree(){
const q=textSearch.toLocaleLowerCase('hr');
let html=sections.map(sec=>{
const matching=(sec.items||[]).filter(i=>(i.item_name+' '+i.group_name+' '+sec.title).toLocaleLowerCase('hr').includes(q));
if(!matching.length)return '';
const groups=[...new Set(matching.map(i=>i.group_name||'Ostalo'))];
const total=sum(matching);
return '<details class="scriptSection" open><summary><span>▶ &nbsp; '+x(sec.title).toUpperCase()+'</span><span class="scriptPill">'+x(total)+'</span></summary>'+groups.map(g=>{const items=matching.filter(i=>(i.group_name||'Ostalo')===g);return '<details class="scriptGroup"><summary><span>▶ &nbsp;'+x(g)+'</span><span class="scriptPill">'+x(sum(items))+'</span></summary><div>'+items.map(i=>'<div class="scriptItem"><div><strong>'+x(i.item_name)+'</strong><small>Stanje '+x(i.current_qty??'—')+'</small></div><span class="scriptQty">'+x(i.current_qty??'—')+'</span></div>').join('')+'</div></details>'}).join('')+'</details>'}).join('');
const fm=fridge.filter(i=>(i.item_name+' '+i.group_name+' Frižider').toLocaleLowerCase('hr').includes(q));
if(fm.length){const groups=[...new Set(fm.map(i=>i.group_name||'Ostalo'))];html+='<details class="scriptSection" open><summary><span>▶ &nbsp; FRIŽIDER</span><span class="scriptPill">'+fridgeFull+' punih</span></summary>'+groups.map(g=>'<details class="scriptGroup"><summary><span>▶ &nbsp;'+x(g)+'</span><span class="scriptPill">'+fm.filter(i=>(i.group_name||'Ostalo')===g).length+' mjesta</span></summary><div>'+fm.filter(i=>(i.group_name||'Ostalo')===g).map(i=>'<div class="scriptItem"><div><strong>'+x(i.item_name)+'</strong><small>Rupe '+x(i.current_qty??'—')+' · Kapacitet '+x(i.full_capacity??'—')+'</small></div><span class="scriptQty">'+x(i.full_capacity==null?'—':Math.max(0,Number(i.full_capacity)-Number(i.current_qty||0)))+'</span></div>').join('')+'</div></details>').join('')+'</details>'}
$('scriptTree').innerHTML=html||'<div class="scriptNotice">Nema pronađenih artikala.</div>';
}

async function count(){const r=await run('appGetCount',state.token,state.mode);state.rows=r.rows||[];renderCountPage();}
function stepperHTML(key,value='',step=1){return '<div class="stepperUI"><button type="button" class="stepperBtn" data-step-key="'+x(key)+'" data-adjust="-1">−</button><input class="qty" type="number" step="any" min="0" placeholder="—" data-count-key="'+x(key)+'" data-unit-step="'+step+'" value="'+x(value)+'"><button type="button" class="stepperBtn" data-step-key="'+x(key)+'" data-adjust="1">+</button></div>'}
function attachSteppers(){document.querySelectorAll('[data-step-key]').forEach(b=>b.onclick=()=>{const i=document.querySelector('[data-count-key="'+CSS.escape(b.dataset.stepKey)+'"]');if(!i)return;const v=Math.max(0,Math.round(((Number(i.value)||0)+Number(b.dataset.adjust)*Number(i.dataset.unitStep||1))*1000)/1000);i.value=v})}
function renderCountPage(draft=null){const isFridge=state.mode==='fridge',tabs=MODES.map(([m,label])=>'<button data-mode="'+m+'" class="'+(m===state.mode?'active':'')+'">'+label+'</button>').join('');const groups={};state.rows.forEach(a=>(groups[a.group_name||'Ostalo']??=[]).push(a));const existing=draft?Object.fromEntries(draft.entries.map(i=>[String(i.key),i.value])):{};shell('<div class="tabs">'+tabs+'</div><section class="panel"><div class="panelTop"><h2>'+(isFridge?'Rupe u frižideru':'Inventura · '+x(MODES.find(m=>m[0]===state.mode)?.[1]))+'</h2><span class="chip">'+state.rows.length+' stavki</span></div><p class="hint">'+(isFridge?'Upiši broj praznih mjesta. Stanje frižidera računa se kao kapacitet minus rupe.':'Prebroji sve artikle. Prije spremanja dobit ćeš pregled manjka i viška po grupama.')+'</p><input id="filterCount" class="search" placeholder="Traži artikl..."><div id="countRows">'+Object.entries(groups).map(([group,rows])=>'<details class="countGroup"><summary>'+x(group)+' <span>'+rows.length+'</span></summary>'+rows.map(a=>'<div class="line countLine" data-name="'+x((a.item_name+' '+group).toLowerCase())+'"><div><strong>'+x(a.item_name)+'</strong><div class="sub">'+(isFridge?'Sada '+a.current_qty+' rupa · Puni frižider '+a.full_capacity:'Očekivano '+a.current_qty)+(a.unit_price?' · '+Number(a.unit_price).toFixed(2)+' €':'')+'</div></div>'+stepperHTML(a.item_location_id,existing[String(a.item_location_id)]??(isFridge?a.current_qty:''),state.mode==='zesta'?0.1:1)+'</div>').join('')+'</details>').join('')+'</div><label class="field">Napomena<input id="countNote" placeholder="npr. kraj smjene" value="'+x(draft?.note||'')+'"></label><div class="stickySave"><button id="saveCount" class="primary">'+(isFridge?'Spremi rupe':'Pregled inventure')+'</button></div></section>','Inventura');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;count()});$('filterCount').oninput=()=>{const q=$('filterCount').value.toLowerCase();document.querySelectorAll('.countLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')};attachSteppers();$('saveCount').onclick=()=>{const entries=[...document.querySelectorAll('[data-count-key]')].map(e=>({key:e.dataset.countKey,value:e.value})),note=$('countNote').value;if(isFridge){if(entries.some(e=>e.value===''))return toast('Unesi broj rupa za sve artikle.');saveCountEntries(entries,note);return}const missing=entries.filter(e=>e.value.trim()==='');if(missing.length)return toast('Za usporedbu popuni svih '+entries.length+' stavki. Nedostaje '+missing.length+'.');const invalid=entries.some(e=>!Number.isFinite(Number(e.value))||Number(e.value)<0);if(invalid)return toast('Provjeri unesene količine.');reviewCount(entries,note)}}
async function saveCountEntries(entries,note){if(!confirm('Potvrditi inventuru i promijeniti stanje?'))return;try{await run('appSaveCount',state.token,state.mode,entries,note);toast('Inventura spremljena.');await count()}catch(e){toast(e.message||'Greška pri spremanju.')}}
function reviewCount(entries,note){const map=Object.fromEntries(entries.map(e=>[String(e.key),Number(e.value)]));const groups={};state.rows.forEach(i=>(groups[i.group_name||'Ostalo']??=[]).push(i));let short=0,surplus=0,expected=0,actual=0,unpriced=0;const blocks=Object.entries(groups).map(([group,items])=>{let gExp=0,gGot=0,gShort=0,gSurplus=0;const details=items.map(i=>{const cur=Number(i.current_qty)||0,n=map[String(i.item_location_id)],diff=Math.round((n-cur)*1000)/1000,price=Number(i.unit_price)||0;gExp+=cur;gGot+=n;if(diff<0)gShort+=-diff*price;else gSurplus+=diff*price;if(diff!==0&&price===0)unpriced++;return{item:i.item_name,cur,n,diff,price}});expected+=gExp;actual+=gGot;short+=gShort;surplus+=gSurplus;const d=gGot-gExp;let msg=d===0?(details.some(i=>i.diff!==0)?'Ukupno isto: razlikuju se samo okusi ili varijante.':'Sve odgovara.'):(d<0?'Manjak '+Math.abs(d)+' u grupi.':'Višak '+d+' u grupi.');return '<details class="countGroup"><summary>'+x(group)+' <span class="'+(d<0?'negative':'positive')+'">'+(d>0?'+':'')+d+'</span></summary><p class="hint">'+x(msg)+' · Manjak '+gShort.toFixed(2)+' € · Višak '+gSurplus.toFixed(2)+' €</p>'+details.filter(i=>i.diff!==0).map(i=>'<div class="line"><div><strong>'+x(i.item)+'</strong><div class="sub">'+i.cur+' → '+i.n+' · '+i.price.toFixed(2)+' €</div></div><b class="'+(i.diff<0?'negative':'positive')+'">'+(i.diff>0?'+':'')+i.diff+'</b></div>').join('')+'</details>'}).join('');const diff=actual-expected;shell('<section class="panel"><div class="panelTop"><h2>Pregled inventure prije spremanja</h2></div><div class="scriptKpis"><div class="scriptKpi"><small>Očekivano</small><strong>'+expected+'</strong></div><div class="scriptKpi"><small>Prebrojano</small><strong>'+actual+'</strong></div><div class="scriptKpi"><small>Razlika</small><strong class="'+(diff<0?'negative':'positive')+'">'+(diff>0?'+':'')+diff+'</strong></div><div class="scriptKpi"><small>Manjak €</small><strong class="negative">'+short.toFixed(2)+'</strong></div><div class="scriptKpi"><small>Višak €</small><strong class="positive">'+surplus.toFixed(2)+'</strong></div></div>'+(unpriced?'<div class="scriptNotice">'+unpriced+' artikala s razlikom nema upisanu cijenu i nisu obračunani u eurima.</div>':'')+'<div class="scriptTree">'+blocks+'</div><div class="stickySave"><button class="soft" id="editCount">← Ispravi</button><button class="primary" id="confirmCount">Potvrdi inventuru</button></div></section>','Pregled inventure');$('editCount').onclick=()=>renderCountPage({entries,note});$('confirmCount').onclick=()=>saveCountEntries(entries,note)}
async function goods(type){const incoming=type==='incoming',catalog=await run('appGetCatalog',state.token);const items=(catalog.sections||[]).flatMap(s=>(s.items||[]).map(a=>({...a,section:s.title})));const lists=incoming?await run('appRecentIncoming',state.token):await run('appRecentSupply',state.token);const history=incoming?'<section class="panel"><h2>Posljednje primke</h2><div class="mini" style="margin-top:15px">'+(lists.length?lists.map(l=>'<div class="miniItem"><strong>'+x(l.item)+' · +'+x(l.qty)+'</strong><small>'+x(l.createdAt)+'</small></div>').join(''):'<p class="hint">Nema ranijih primki.</p>')+'</div></section>':'<section class="panel"><h2>Popisi za donos</h2><div class="mini" style="margin-top:15px">'+(lists.length?lists.map(l=>'<div class="line"><div><strong>'+x(l.waiter)+' · '+x(l.itemCount)+' stavki</strong><div class="sub">'+x(l.createdAt)+' · '+x(l.status)+'</div></div><button class="soft openSupply" data-id="'+x(l.listId)+'">'+(l.status==='CEKA'?'Potvrdi':'Pregled')+'</button></div>').join(''):'<p class="hint">Još nema izrađenih popisa.</p>')+'</div><div id="supplyDetail"></div></section>';shell('<section class="panel"><div class="panelTop"><h2>'+(incoming?'Nova primka':'Novi popis za donos')+'</h2><span class="chip">'+items.length+' artikala</span></div><p class="hint">'+(incoming?'Unesi količine zaprimljene robe.':'Odaberi količine koje konobar treba donijeti iz skladišta. Donos se potvrđuje naknadno.')+'</p><input id="goodsFilter" class="search" placeholder="Pretraži artikle"><div id="goodsLines">'+items.map(a=>'<div class="line goodsLine" data-name="'+x((a.item_name+' '+a.group_name).toLowerCase())+'"><div><strong>'+x(a.item_name)+'</strong><div class="sub">'+x(a.section)+' · Stanje '+(a.current_qty??'—')+'</div></div><input class="qty" data-goods-key="'+x(a.key)+'" type="number" step="any" min="0" placeholder="0"></div>').join('')+'</div><label class="field" style="margin-top:16px">Napomena<textarea id="goodsNote" rows="2" placeholder="Opcionalno"></textarea></label><div class="stickySave"><span class="sub">Spremi odabrane količine.</span><button class="primary" id="saveGoods">'+(incoming?'Spremi primku':'Izradi popis')+'</button></div></section>'+history,incoming?'Primka robe':'Donos iz skladišta');$('goodsFilter').oninput=()=>{let q=$('goodsFilter').value.toLowerCase();document.querySelectorAll('.goodsLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')};$('saveGoods').onclick=async()=>{const entries=[...document.querySelectorAll('[data-goods-key]')].filter(e=>Number(e.value)>0).map(e=>({key:e.dataset.goodsKey,value:e.value}));if(!entries.length)return toast('Odaberi barem jedan artikl.');if(!confirm((incoming?'Zaprimiti robu':'Izraditi popis')+' za '+entries.length+' stavki?'))return;try{await run(incoming?'appSaveIncoming':'appCreateSupply',state.token,entries,$('goodsNote').value);toast(incoming?'Primka spremljena.':'Popis za donos izrađen.');openPage(type)}catch{}};document.querySelectorAll('.openSupply').forEach(b=>b.onclick=async()=>{try{const d=await run('appGetSupplyList',state.token,b.dataset.id),editable=d.status==='CEKA';$('supplyDetail').innerHTML='<h3 class="groupTitle">Popis · '+x(d.createdAt)+'</h3>'+(d.items||[]).map(it=>'<div class="line"><div><strong>'+x(it.item)+'</strong><div class="sub">Traženo '+x(it.qty)+' · stanje pri izradi '+x(it.stock)+'</div></div>'+(editable?'<select class="decision" data-key="'+x(it.key)+'"><option value="">Odaberi</option><option value="DONESENO">Doneseno</option><option value="NEMA">Nema</option></select>':'<span class="pill">'+x(it.decision)+'</span>')+'</div>').join('')+(editable?'<button id="finishSupply" class="primary" style="margin-top:16px">Završi popis</button>':'');if(editable)$('finishSupply').onclick=async()=>{const decisions=[...document.querySelectorAll('.decision')].map(el=>({key:el.dataset.key,decision:el.value}));if(decisions.some(d=>!d.decision))return toast('Označi svaku stavku.');if(!confirm('Potvrditi donos robe i ažurirati zalihe?'))return;try{await run('appFinishSupply',state.token,d.listId,decisions);toast('Popis je potvrđen.');goods('supply')}catch{}};$('supplyDetail').scrollIntoView({behavior:'smooth'})}catch{}})}
async function orderList(){const cat=await run('appGetCatalog',state.token);const items=(cat.sections||[]).flatMap(sec=>(sec.items||[]).map(i=>({...i,_mode:sec.key,_section:sec.title})));const rule=i=>i._mode==='pivo'&&i.group_name==='Veliko pivo'?60:i._mode==='pivo'&&i.group_name==='Malo pivo'?30:i._mode==='toplo'&&i.group_name==='Cappuccino'?80:i._mode==='pica'?10:null;const rows=items.map(i=>({...i,limit:rule(i)}));const need=rows.filter(i=>i.limit!==null&&i.current_qty<i.limit).length;shell('<section class="panel"><div class="panelTop"><h2>Narudžba robe</h2><span class="chip">'+need+' za naručiti</span></div><p class="hint">Pragovi iz originalnog Scripta: veliko pivo ispod 60, malo pivo ispod 30, cappuccino ispod 80, pića ispod 10.</p><input id="orderFilter" class="search" placeholder="Traži artikl..."><div id="orderRows">'+rows.map(i=>'<div class="line orderLine" data-name="'+x((i.item_name+' '+i.group_name+' '+i._section).toLowerCase())+'" style="'+(i.limit!==null&&i.current_qty<i.limit?'background:#fff3f1;border-left:3px solid #b42318;':'')+'"><div><strong>'+x(i.item_name)+'</strong><div class="sub">'+x(i._section)+' · '+x(i.group_name)+(i.limit===null?' · Bez zadanog praga':' · Prag '+i.limit)+'</div></div><div style="text-align:right"><strong>'+x(i.current_qty??'—')+'</strong>'+(i.limit!==null&&i.current_qty<i.limit?'<div class="negative">NARUČITI</div>':'')+'</div></div>').join('')+'</div></section>','Narudžba robe');$('orderFilter').oninput=()=>{const q=$('orderFilter').value.toLowerCase();document.querySelectorAll('.orderLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')}} 
async function total(){const result=await run('appGetTotalState',state.token);const vals=result.values||[];shell('<section class="panel"><div class="panelTop"><h2>Stanje prema Google Sheetu</h2><button class="soft" id="totalExport">↓ CSV</button></div><div class="scroller"><table><tbody>'+vals.map((row,i)=>'<tr>'+row.map(v=>i===0?'<th>'+x(v)+'</th>':'<td>'+x(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>','Ukupno stanje');$('totalExport').onclick=()=>exportCSV(vals.slice(1),vals[0]||[])}
async function backups(){const r=await run('appGetBackups',state.token);const comparison=r.comparison;const rows=comparison?(comparison.sections||[]).flatMap(s=>(s.items||[]).map(a=>({section:s.title,...a}))):[];shell('<section class="panel"><div class="panelTop"><h2>Usporedba s prethodnom kopijom</h2><div class="tools"><span class="chip">'+x(comparison?.date||'Nema kopije')+'</span>'+(state.user.role==='ADMIN'?'<button id="snapshotNow" class="primary">Spremi kopiju stanja</button>':'')+'</div></div>'+(rows.length?'<div class="scroller"><table><thead><tr><th>Grupa</th><th>Artikl</th><th>Prije</th><th>Sada</th><th>Razlika</th></tr></thead><tbody>'+rows.map(a=>'<tr><td>'+x(a.section)+'</td><td>'+x(a.item_name)+'</td><td>'+x(a.previous_qty)+'</td><td>'+x(a.current_qty)+'</td><td>'+x(a.diff)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nema prethodne kopije za usporedbu.</div>')+'</section>','Usporedba stanja');if($('snapshotNow'))$('snapshotNow').onclick=async()=>{if(!confirm('Spremiti trenutno stanje svih artikala?'))return;try{await run('appCreateSnapshot',state.token);toast('Kopija stanja spremljena.');backups()}catch{}}}
async function admin(){if(state.user?.role!=='ADMIN')return openPage('home');const a=await run('appAdminGetData',state.token);state.admin=a;shell('<div class="grid"><section class="panel"><div class="panelTop"><h2>Zaposlenici</h2></div><div class="mini">'+(a.users||[]).map(u=>'<div class="line"><div><strong>'+x(u.name)+'</strong><div class="sub">'+x(u.role)+' · '+(u.active?'Aktivan':'Neaktivan')+'</div></div>'+(u.role==='ADMIN'?'':'<button class="soft delUser" data-id="'+x(u.id)+'">Ukloni</button>')+'</div>').join('')+'</div><h3 class="groupTitle">Dodaj zaposlenika</h3><form id="newUser" class="stack"><input id="newUserName" required placeholder="Ime zaposlenika"><input id="newUserPin" required type="password" inputmode="numeric" minlength="4" maxlength="8" placeholder="PIN (4–8 znamenki)"><button class="primary">Dodaj zaposlenika</button></form></section><section class="panel"><div class="panelTop"><h2>Artikli</h2><span class="chip">'+(a.items||[]).length+' aktivnih</span></div><input id="adminSearch" class="search" placeholder="Pretraži artikle"><div id="adminItems" class="mini">'+(a.items||[]).map(it=>'<div class="line adminLine" data-name="'+x(it.item.toLowerCase())+'"><div><strong>'+x(it.item)+'</strong><div class="sub">'+x(it.group)+' · '+x(it.mode)+'</div></div><button class="soft delItem" data-key="'+x(it.key)+'">Ukloni</button></div>').join('')+'</div><h3 class="groupTitle">Dodaj skladišni artikl</h3><form id="newItem" class="stack"><select id="newItemMode">'+MODES.slice(0,4).map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select><input id="newItemGroup" required placeholder="Grupa"><input id="newItemName" required placeholder="Naziv artikla"><input id="newItemPrice" type="number" step="0.01" min="0" placeholder="Jedinična cijena (opcionalno)"><button class="primary">Dodaj artikl</button></form></section></div>','Administracija');$('newUser').onsubmit=async e=>{e.preventDefault();try{await run('appAdminAddUser',state.token,$('newUserName').value,$('newUserPin').value);toast('Zaposlenik dodan.');admin()}catch{}};$('newItem').onsubmit=async e=>{e.preventDefault();try{await run('appAdminAddItem',state.token,{mode:$('newItemMode').value,group:$('newItemGroup').value,item:$('newItemName').value,price:$('newItemPrice').value});toast('Artikl dodan.');admin()}catch{}};document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{if(!confirm('Ukloniti zaposlenika?'))return;try{await run('appAdminDeleteUser',state.token,b.dataset.id);admin()}catch{}});document.querySelectorAll('.delItem').forEach(b=>b.onclick=async()=>{if(!confirm('Deaktivirati artikl?'))return;try{await run('appAdminDeleteItem',state.token,b.dataset.key);admin()}catch{}});$('adminSearch').oninput=()=>{const q=$('adminSearch').value.toLowerCase();document.querySelectorAll('.adminLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')}}
function exportCSV(rows,head){const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='skladiste-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
loginView();if(!demo)setInterval(()=>{if(state.user&&state.page==='home'&&!state.busy&&document.visibilityState==='visible')home().catch(()=>{})},30000);
