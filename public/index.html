function reviewCount(entries,note){const map=Object.fromEntries(entries.map(e=>[String(e.key),parsedQty(e.value)]));const groups={};orderedItems(state.mode,state.rows).forEach(i=>(groups[itemGroup(state.mode,i)]??=[]).push(i));let short=0,surplus=0,expected=0,actual=0,unpriced=0;const blocks=Object.entries(groups).map(([group,items])=>{let gExp=0,gGot=0,gShort=0,gSurplus=0;const details=items.map(i=>{const cur=Number(i.current_qty)||0,n=map[String(i.item_location_id)],diff=Math.round((n-cur)*1000)/1000,price=Number(i.unit_price)||0;gExp+=cur;gGot+=n;if(diff<0)gShort+=-diff*price;else gSurplus+=diff*price;if(diff!==0&&price===0)unpriced++;return{item:i.item_name,cur,n,diff,price}});expected+=gExp;actual+=gGot;short+=gShort;surplus+=gSurplus;const d=gGot-gExp;let msg=d===0?(details.some(i=>i.diff!==0)?'Ukupno isto: razlikuju se samo okusi ili varijante.':'Sve odgovara.'):(d<0?'Manjak '+Math.abs(d)+' u grupi.':'Višak '+d+' u grupi.');return '<details class="countGroup"><summary>'+x(group)+' <span class="'+(d<0?'negative':'positive')+'">'+(d>0?'+':'')+d+'</span></summary><p class="hint">'+x(msg)+' · Manjak '+gShort.toFixed(2)+' € · Višak '+gSurplus.toFixed(2)+' €</p>'+details.filter(i=>i.diff!==0).map(i=>'<div class="line"><div><strong>'+x(i.item)+'</strong><div class="sub">'+i.cur+' → '+i.n+' · '+i.price.toFixed(2)+' €</div></div><b class="'+(i.diff<0?'negative':'positive')+'">'+(i.diff>0?'+':'')+i.diff+'</b></div>').join('')+'</details>'}).join('');const diff=actual-expected;shell('<section class="panel"><div class="panelTop"><h2>Pregled inventure prije spremanja</h2></div><div class="scriptKpis"><div class="scriptKpi"><small>Očekivano</small><strong>'+expected+'</strong></div><div class="scriptKpi"><small>Prebrojano</small><strong>'+actual+'</strong></div><div class="scriptKpi"><small>Razlika</small><strong class="'+(diff<0?'negative':'positive')+'">'+(diff>0?'+':'')+diff+'</strong></div><div class="scriptKpi"><small>Manjak €</small><strong class="negative">'+short.toFixed(2)+'</strong></div><div class="scriptKpi"><small>Višak €</small><strong class="positive">'+surplus.toFixed(2)+'</strong></div></div>'+(unpriced?'<div class="scriptNotice">'+unpriced+' artikala s razlikom nema upisanu cijenu i nisu obračunani u eurima.</div>':'')+'<div class="scriptTree">'+blocks+'</div><div class="stickySave"><button class="soft" id="editCount">← Ispravi</button><button class="primary" id="confirmCount">Potvrdi inventuru</button></div></section>','Pregled inventure');$('editCount').onclick=()=>renderCountPage({entries,note});$('confirmCount').onclick=()=>saveCountEntries(entries,note)}

function itemGroup(mode,item){
 const key=String(item.key||item.item_location_id||'');
 const f=key.match(/^seed-fridge-(\d+)$/);

 return g;

function itemOrder(mode,item){
 const key=String(item.key||item.item_location_id||'');
 const match=key.match(/^seed-(pivo|pica|zesta|toplo|fridge)-(\d+)$/);
 if(match&&match[1]===mode){
  const n=Number(match[2]);
  return mode==='fridge'?(FRIDGE_SEED_POSITION[n]??n+200):n;
 }
 const name=String(item.item_name||item.item||'');
 const originals=ORIGINAL_ITEM_ORDER[mode]||[];
 const idx=originals.indexOf(name);
 return idx<0?10000:idx+1;
}
