<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Skladište • Upravljanje zalihama</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6fa;color:#18263c;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}aside{background:#12203a;color:#a7b8d1;padding:23px 14px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:white;padding:7px 12px;letter-spacing:-.5px}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:#457af1;color:white}.sectionLabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#6f87a9;padding:0 15px;margin-bottom:8px}.menu{display:grid;gap:3px}.menu button{width:100%;text-align:left;border:0;background:transparent;color:#a7b8d1;border-radius:9px;padding:12px 14px;font-weight:550}.menu button:hover,.menu button.sel{background:#293e5f;color:white}.sideBottom{margin-top:auto;padding:15px;font-size:12px;line-height:1.8;border-top:1px solid #30415e}.sideBottom strong{color:white}.content{padding:34px clamp(18px,3.6vw,56px);min-width:0}.mobileBrand{display:none}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}.eyebrow{font-size:11px;color:#8b97a8;font-weight:750;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:29px;letter-spacing:-1px;margin:6px 0 0}h2{font-size:17px;letter-spacing:-.3px;margin:0}.sub{color:#8090a4;font-size:12px}.status{padding:9px 12px;background:#e8f4ed;color:#297d57;font-size:12px;border-radius:20px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.metric,.panel{border-radius:15px;border:1px solid #e6ebf3;background:white;box-shadow:0 4px 16px #17314e08}.metric{padding:22px}.metric .n{font-size:30px;font-weight:800;margin:11px 0 5px;letter-spacing:-1px}.metric .m{color:#7d8b9d;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.panel{padding:21px;margin-bottom:17px;min-width:0}.panelTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button.primary,button.soft,button.outline{border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700;border:0}button.primary{background:#366deb;color:white}button.soft{background:#edf2fa;color:#344862}button.outline{background:white;border:1px solid #dce4ef;color:#344862}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{border:1px solid #dfe6f0;padding:11px 12px;border-radius:9px;color:#263853;background:white;max-width:100%;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid #aec5ff;outline-offset:0}.search{max-width:280px;margin-bottom:14px}.scroller{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left;min-width:540px}td,th{padding:13px 11px;border-bottom:1px solid #eef1f6}th{background:#f8fafd;color:#8794a6;text-transform:uppercase;font-size:10px;letter-spacing:1px;font-weight:750}td:first-child{font-weight:650}.pill{display:inline-block;border-radius:50px;padding:5px 10px;background:#e8f7ef;color:#248454;font-size:11px;font-weight:700}.pill.warn{background:#fff3df;color:#ab6a24}.pill.bad{background:#feebeb;color:#b64343}.mini{display:grid;gap:11px}.miniItem{padding-bottom:11px;border-bottom:1px solid #eef2f6}.miniItem strong{font-size:12px;display:block}.miniItem small{color:#8793a3;display:block;margin-top:4px}.empty{padding:25px;color:#7d8b9d;text-align:center}.hint{font-size:12px;color:#78869a;line-height:1.65}.line{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #edf1f5}.line strong{font-size:13px}.qty{max-width:110px;text-align:right}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;font-size:12px;font-weight:650}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.chip{padding:5px 9px;border-radius:8px;background:#f0f4fa;color:#68809c;font-size:11px}.loginWrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 75% 15%,#273e63,#111d32 58%)}.loginCard{background:white;border-radius:18px;padding:32px;max-width:400px;width:100%;box-shadow:0 30px 80px #06101f4d}.loginCard h1{margin:18px 0 9px;font-size:27px}.loginCard p{color:#8492a3;line-height:1.6}.stack{display:grid;gap:15px}.notice{padding:11px 13px;border-radius:9px;background:#fff6e6;color:#93652d;font-size:12px;line-height:1.6}.toast{position:fixed;bottom:20px;right:20px;background:#172b45;color:white;padding:12px 17px;border-radius:10px;box-shadow:0 8px 40px #152a4650;max-width:min(420px,90vw);z-index:10}.hide{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs button{border:1px solid #e0e7f0;background:white;color:#5d728f;padding:9px 13px;border-radius:9px;font-weight:650}.tabs button.active{background:#366deb;color:white;border-color:#366deb}.groupTitle{margin:23px 0 10px;font-size:13px;color:#4770ae}.stickySave{position:sticky;bottom:12px;background:#fff;border:1px solid #e5ebf3;padding:13px;border-radius:13px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 9px 35px #12244220;margin-top:15px}.mobileNav{display:none}@media(max-width:1150px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:740px){.app{display:block;padding-bottom:75px}aside{display:none}.mobileBrand{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:18px;font-weight:800}.content{padding:19px 14px}h1{font-size:25px}.metric{padding:16px}.metric .n{font-size:26px}.panel{padding:15px}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#12203a;z-index:5;overflow:auto;padding:7px 4px;gap:4px}.mobileNav button{border:0;background:transparent;color:#c5d1e1;padding:10px;min-width:76px;font-size:11px;border-radius:8px}.mobileNav button.sel{background:#30486d;color:white}.formGrid{grid-template-columns:1fr}.heading{align-items:flex-start}.status{white-space:nowrap}}
</style></head><body><div id="root"></div><div id="toast" class="toast hide"></div><script>
const MODES=[['pivo','Pivo'],['pica','Pića'],['zesta','Žesta'],['toplo','Topli napitci'],['fridge','Frižider']];
const SECTIONS=[['home','Pregled'],['count','Inventura'],['supply','Donos robe'],['incoming','Primka robe'],['total','Ukupno stanje'],['backups','Usporedba'],['admin','Administracija']];
const DEMO_ITEMS={pivo:[['Ožujsko',75],['Staropramen',42],['Becks',18],['Vukovarsko',36],['Bavaria',11]],pica:[['Coca Cola',38],['Coca Cola Zero',20],['Jana',64],['Jamnica',16],['Red Bull',14]],zesta:[['Gin',8],['Konjak',11],['Pelinkovac',19],['Vodka',15]],toplo:[['Kava',40],['Čaj',35],['Cappuccino',18]],fridge:[['Ožujsko',10],['Staropramen',9],['Coca Cola',11],['Jana',12]]};
const demo=!(typeof google!=='undefined'&&google.script&&google.script.run);
let state={token:null,user:null,page:'home',mode:'pivo',busy:false,catalog:null,admin:null,rows:[],selected:[],activity:[],search:''};
function x(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function $(id){return document.getElementById(id)}function toast(msg){const e=$('toast');e.textContent=msg;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),4000)}
function call(fn,...args){if(demo)return Promise.resolve(mock(fn,...args));return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err.message||String(err))))[fn](...args))}
function mock(fn,...args){if(fn==='appPublicConfig')return{users:[{id:'demo',name:'Demo korisnik'}]};if(fn==='appLogin')return{token:'demo',waiter:{id:'demo',name:'Demo korisnik',role:'ADMIN'}};if(fn==='appBootstrap')return{waiter:state.user};if(fn==='appGetCount'){const m=args[1];return{rows:(DEMO_ITEMS[m]||[]).map(([name,qty],i)=>({item_location_id:String(i),group_name:m==='fridge'?'Hladnjak':m.toUpperCase(),item_name:name,current_qty:qty,count_mode:m==='fridge'?'holes':'quantity',full_capacity:m==='fridge'?24:null}))}}if(fn==='appGetCatalog')return{sections:MODES.slice(0,4).map(([k,v])=>({key:k,title:v,items:(DEMO_ITEMS[k]||[]).map(([n,q],i)=>({key:k+':'+i,mode:k,group_name:v,item_name:n,current_qty:q}))}))};if(fn==='appGetTotalState')return{values:[['Artikl','Količina'],...Object.values(DEMO_ITEMS).flat().map(a=>a)]};if(fn==='appGetBackups')return{backups:[],comparison:null};if(fn==='appRecentIncoming'||fn==='appRecentSupply')return[];if(fn==='appAdminGetData')return{users:[{id:'demo',name:'Demo korisnik',role:'ADMIN',active:true}],items:[]};if(fn==='appSaveCount'){const m=args[1],entries=args[2];entries.forEach(e=>{let row=DEMO_ITEMS[m]?.[Number(e.key)];if(row)row[1]=Number(e.value)});return{saved:entries.length}}if(fn==='appSaveIncoming'||fn==='appCreateSupply')return{saved:args[1].length};if(fn==='appAdminAddUser'||fn==='appAdminDeleteUser'||fn==='appAdminAddItem'||fn==='appAdminDeleteItem')return mock('appAdminGetData');return true}
async function run(fn,...args){try{state.busy=true;const res=await call(fn,...args);return res}catch(err){toast('Greška: '+err.message);throw err}finally{state.busy=false}}
function shell(content,title,overline='SKLADIŠNA EVIDENCIJA'){let nav=SECTIONS.filter(([id])=>id!=='admin'||state.user?.role==='ADMIN');const side=nav.map(([id,label])=>'<button class="'+(id===state.page?'sel':'')+'" data-page="'+id+'">'+({'home':'▤','count':'▦','supply':'↗','incoming':'↙','total':'≡','backups':'◷','admin':'⚙'}[id]||'')+' &nbsp; '+label+'</button>').join('');$('root').innerHTML='<div class="app"><aside><div class="brand"><span class="logo">▦</span>Skladište</div><div><div class="sectionLabel">IZBORNIK</div><nav class="menu">'+side+'</nav></div><div class="sideBottom">Prijavljen: <strong>'+x(state.user?.name)+'</strong><br><button class="soft" id="logout">Odjava</button></div></aside><main class="content"><div class="mobileBrand"><span class="logo">▦</span> Skladište</div><header class="heading"><div><div class="eyebrow">'+x(overline)+'</div><h1>'+x(title)+'</h1></div><span class="status">'+(demo?'● DEMO':'● Povezano')+'</span></header>'+content+'</main><nav class="mobileNav">'+nav.map(([id,label])=>'<button class="'+(id===state.page?'sel':'')+'" data-page="'+id+'">'+x(label)+'</button>').join('')+'</nav></div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));$('logout').onclick=()=>{if(!demo)call('appLogout',state.token).catch(()=>{});state.token=null;state.user=null;loginView()}}
async function loginView(){if(demo){state.user={id:'demo',name:'Demo korisnik',role:'ADMIN'};state.token='demo';return openPage('home')} $('root').innerHTML='<div class="loginWrap"><div class="loginCard"><div class="logo">▦</div><h1>Prijava u skladište</h1><p>Odaberi korisnika i upiši osobni PIN.</p><form id="loginForm" class="stack"><label class="field">Zaposlenik<select id="loginUser" required><option>Učitavanje...</option></select></label><label class="field">PIN<input id="loginPin" type="password" inputmode="numeric" autocomplete="off" required placeholder="••••"></label><button class="primary">Prijavi se</button></form></div></div>';try{const config=await run('appPublicConfig');$('loginUser').innerHTML=config.users.map(u=>'<option value="'+x(u.id)+'">'+x(u.name)+'</option>').join('');$('loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await run('appLogin',$('loginUser').value,$('loginPin').value);state.token=r.token;state.user=r.waiter;openPage('home')}catch{}}}catch{}}
async function openPage(page){state.page=page;try{if(page==='home')await home();if(page==='count')await count();if(page==='supply')await goods('supply');if(page==='incoming')await goods('incoming');if(page==='total')await total();if(page==='backups')await backups();if(page==='admin')await admin()}catch(e){if(/sesija|session/i.test(e.message))loginView()}}
function overviewRows(){return MODES.slice(0,4).flatMap(([k,label])=>(DEMO_ITEMS[k]||[]).map(([name,qty])=>({name,qty,section:label})))}
async function home(){const catalog=await run('appGetCatalog',state.token);state.catalog=catalog;const sections=catalog.sections||[],items=sections.flatMap(s=>s.items||[]),low=items.filter(a=>a.current_qty!==null&&a.current_qty<=10),totalQty=items.reduce((n,a)=>n+(Number(a.current_qty)||0),0);const cards=[['Artikala',items.length,'Aktivnih artikala'],['Ukupna količina',totalQty.toLocaleString('hr-HR'),'Komada u skladištu'],['Niske zalihe',low.length,'10 ili manje komada'],['Kategorije',sections.length,'Aktivnih skupina']];const table=items.slice(0,15).map(a=>'<tr><td>'+x(a.item_name)+'</td><td>'+x(a.section_name||a.group_name||'')+'</td><td>'+(a.current_qty??'—')+'</td><td><span class="pill '+(a.current_qty<=10?'warn':'')+'">'+(a.current_qty<=10?'Provjeriti':'Na zalihi')+'</span></td></tr>').join('');shell('<div class="cards">'+cards.map(a=>'<div class="metric"><div class="sub">'+x(a[0])+'</div><div class="n">'+x(a[1])+'</div><div class="m">'+x(a[2])+'</div></div>').join('')+'</div><div class="grid"><section class="panel"><div class="panelTop"><h2>Pregled artikala</h2><div class="tools"><button class="soft" id="exportCatalog">↓ CSV</button><button class="primary" id="goCount">Nova inventura</button></div></div><div class="scroller"><table><thead><tr><th>Artikl</th><th>Grupa</th><th>Količina</th><th>Status</th></tr></thead><tbody>'+table+'</tbody></table></div></section><section class="panel"><div class="panelTop"><h2>Brze radnje</h2></div><div class="mini">'+[['count','Prebroji skladište','Unesi novo stvarno stanje robe'],['incoming','Zaprimanje robe','Dodaj robu na skladište'],['supply','Donos iz skladišta','Izradi popis za konobara']].map(a=>'<div class="miniItem"><strong>'+a[1]+'</strong><small>'+a[2]+'</small><button class="soft" style="margin-top:8px" data-quick="'+a[0]+'">Otvori</button></div>').join('')+'</div><p class="hint">'+(demo?'Demo radi lokalno, bez izmjena stvarnih zaliha.':'Podaci se učitavaju iz Google Sheetsa.')+'</p></section></div>','Nadzorna ploča');$('goCount').onclick=()=>openPage('count');$('exportCatalog').onclick=()=>exportCSV(items.map(a=>[a.section_name||'',a.group_name||'',a.item_name||'',a.current_qty??'']),['Dio','Grupa','Artikl','Stanje']);document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>openPage(b.dataset.quick))}
async function count(){const r=await run('appGetCount',state.token,state.mode);state.rows=r.rows||[];const tabs=MODES.map(([m,label])=>'<button data-mode="'+m+'" class="'+(m===state.mode?'active':'')+'">'+label+'</button>').join('');const groups={};state.rows.forEach(a=>(groups[a.group_name||'Ostalo']??=[]).push(a));shell('<div class="tabs">'+tabs+'</div><section class="panel"><div class="panelTop"><h2>'+x(MODES.find(m=>m[0]===state.mode)?.[1])+' – popis artikala</h2><span class="chip">'+state.rows.length+' stavki</span></div><p class="hint">'+(state.mode==='fridge'?'Za frižider unosi se broj praznih mjesta (rupa), a ne broj punih boca.':'Upiši prebrojeno stanje samo za artikle koje želiš ažurirati.')+'</p><input id="filterCount" class="search" placeholder="Traži artikl..."><div id="countRows">'+countRowsHTML(groups)+'</div><div class="stickySave"><span class="sub">Spremanje mijenja stvarno stanje skladišta.</span><button id="saveCount" class="primary">Spremi inventuru</button></div></section>','Inventura');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;count()});$('filterCount').oninput=()=>{let q=$('filterCount').value.toLowerCase();document.querySelectorAll('.countLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')};$('saveCount').onclick=async()=>{const entries=[...document.querySelectorAll('[data-count-key]')].filter(e=>e.value.trim()!=='').map(e=>({key:e.dataset.countKey,value:e.value}));if(!entries.length)return toast('Unesi barem jednu količinu.');if(!confirm('Spremiti '+entries.length+' stavki inventure?'))return;try{await run('appSaveCount',state.token,state.mode,entries,'Unos iz web aplikacije');toast('Inventura spremljena.');await count()}catch{}}}
function countRowsHTML(groups){return Object.entries(groups).map(([group,rows])=>'<h3 class="groupTitle">'+x(group)+'</h3>'+rows.map(a=>'<div class="line countLine" data-name="'+x((a.item_name+' '+group).toLowerCase())+'"><div><strong>'+x(a.item_name)+'</strong><div class="sub">Trenutačno: '+(a.current_qty??'—')+(a.full_capacity!==null&&a.full_capacity!==undefined?' · Kapacitet '+a.full_capacity:'')+'</div></div><input class="qty" type="number" step="any" min="0" '+(a.full_capacity!==null&&a.full_capacity!==undefined?'max="'+a.full_capacity+'"':'')+' placeholder="Novo" data-count-key="'+x(a.item_location_id)+'"></div>').join('')).join('')||'<p class="empty">Nema artikala.</p>'}
async function goods(type){const incoming=type==='incoming',catalog=await run('appGetCatalog',state.token);const items=(catalog.sections||[]).flatMap(s=>(s.items||[]).map(a=>({...a,section:s.title})));shell('<section class="panel"><div class="panelTop"><h2>'+(incoming?'Nova primka':'Novi popis za donos')+'</h2><span class="chip">'+items.length+' artikala</span></div><p class="hint">'+(incoming?'Unesi količine zaprimljene robe.':'Odaberi količine koje konobar treba donijeti iz skladišta. Donos se potvrđuje naknadno.')+'</p><input id="goodsFilter" class="search" placeholder="Pretraži artikle"><div id="goodsLines">'+items.map(a=>'<div class="line goodsLine" data-name="'+x((a.item_name+' '+a.group_name).toLowerCase())+'"><div><strong>'+x(a.item_name)+'</strong><div class="sub">'+x(a.section)+' · Stanje '+(a.current_qty??'—')+'</div></div><input class="qty" data-goods-key="'+x(a.key)+'" type="number" step="any" min="0" placeholder="0"></div>').join('')+'</div><label class="field" style="margin-top:16px">Napomena<textarea id="goodsNote" rows="2" placeholder="Opcionalno"></textarea></label><div class="stickySave"><span class="sub">Spremi odabrane količine.</span><button class="primary" id="saveGoods">'+(incoming?'Spremi primku':'Izradi popis')+'</button></div></section>',''+(incoming?'Primka robe':'Donos iz skladišta'));$('goodsFilter').oninput=()=>{let q=$('goodsFilter').value.toLowerCase();document.querySelectorAll('.goodsLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')};$('saveGoods').onclick=async()=>{const entries=[...document.querySelectorAll('[data-goods-key]')].filter(e=>Number(e.value)>0).map(e=>({key:e.dataset.goodsKey,value:e.value}));if(!entries.length)return toast('Odaberi barem jedan artikl.');if(!confirm((incoming?'Zaprimiti robu':'Izraditi popis')+' za '+entries.length+' stavki?'))return;try{await run(incoming?'appSaveIncoming':'appCreateSupply',state.token,entries,$('goodsNote').value);toast(incoming?'Primka spremljena.':'Popis za donos izrađen.');openPage(type)}catch{}}}
async function total(){const result=await run('appGetTotalState',state.token);const vals=result.values||[];shell('<section class="panel"><div class="panelTop"><h2>Stanje prema Google Sheetu</h2><button class="soft" id="totalExport">↓ CSV</button></div><div class="scroller"><table><tbody>'+vals.map((row,i)=>'<tr>'+row.map(v=>i===0?'<th>'+x(v)+'</th>':'<td>'+x(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>','Ukupno stanje');$('totalExport').onclick=()=>exportCSV(vals.slice(1),vals[0]||[])}
async function backups(){const r=await run('appGetBackups',state.token);const comparison=r.comparison;const rows=comparison?(comparison.sections||[]).flatMap(s=>(s.items||[]).map(a=>({section:s.title,...a}))):[];shell('<section class="panel"><div class="panelTop"><h2>Usporedba s prethodnom kopijom</h2><span class="chip">'+x(comparison?.date||'Nema kopije')+'</span></div>'+(rows.length?'<div class="scroller"><table><thead><tr><th>Grupa</th><th>Artikl</th><th>Prije</th><th>Sada</th><th>Razlika</th></tr></thead><tbody>'+rows.map(a=>'<tr><td>'+x(a.section)+'</td><td>'+x(a.item_name)+'</td><td>'+x(a.previous_qty)+'</td><td>'+x(a.current_qty)+'</td><td>'+x(a.diff)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nema prethodne kopije za usporedbu.</div>')+'</section>','Usporedba stanja')}
async function admin(){if(state.user?.role!=='ADMIN')return openPage('home');const a=await run('appAdminGetData',state.token);state.admin=a;shell('<div class="grid"><section class="panel"><div class="panelTop"><h2>Zaposlenici</h2></div><div class="mini">'+(a.users||[]).map(u=>'<div class="line"><div><strong>'+x(u.name)+'</strong><div class="sub">'+x(u.role)+' · '+(u.active?'Aktivan':'Neaktivan')+'</div></div>'+(u.role==='ADMIN'?'':'<button class="soft delUser" data-id="'+x(u.id)+'">Ukloni</button>')+'</div>').join('')+'</div><h3 class="groupTitle">Dodaj zaposlenika</h3><form id="newUser" class="stack"><input id="newUserName" required placeholder="Ime zaposlenika"><input id="newUserPin" required type="password" inputmode="numeric" minlength="4" maxlength="8" placeholder="PIN (4–8 znamenki)"><button class="primary">Dodaj zaposlenika</button></form></section><section class="panel"><div class="panelTop"><h2>Artikli</h2><span class="chip">'+(a.items||[]).length+' aktivnih</span></div><input id="adminSearch" class="search" placeholder="Pretraži artikle"><div id="adminItems" class="mini">'+(a.items||[]).map(it=>'<div class="line adminLine" data-name="'+x(it.item.toLowerCase())+'"><div><strong>'+x(it.item)+'</strong><div class="sub">'+x(it.group)+' · '+x(it.mode)+'</div></div><button class="soft delItem" data-key="'+x(it.key)+'">Ukloni</button></div>').join('')+'</div><h3 class="groupTitle">Dodaj skladišni artikl</h3><form id="newItem" class="stack"><select id="newItemMode">'+MODES.slice(0,4).map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select><input id="newItemGroup" required placeholder="Grupa"><input id="newItemName" required placeholder="Naziv artikla"><input id="newItemPrice" type="number" step="0.01" min="0" placeholder="Jedinična cijena (opcionalno)"><button class="primary">Dodaj artikl</button></form></section></div>','Administracija');$('newUser').onsubmit=async e=>{e.preventDefault();try{await run('appAdminAddUser',state.token,$('newUserName').value,$('newUserPin').value);toast('Zaposlenik dodan.');admin()}catch{}};$('newItem').onsubmit=async e=>{e.preventDefault();try{await run('appAdminAddItem',state.token,{mode:$('newItemMode').value,group:$('newItemGroup').value,item:$('newItemName').value,price:$('newItemPrice').value});toast('Artikl dodan.');admin()}catch{}};document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{if(!confirm('Ukloniti zaposlenika?'))return;try{await run('appAdminDeleteUser',state.token,b.dataset.id);admin()}catch{}});document.querySelectorAll('.delItem').forEach(b=>b.onclick=async()=>{if(!confirm('Deaktivirati artikl?'))return;try{await run('appAdminDeleteItem',state.token,b.dataset.key);admin()}catch{}});$('adminSearch').oninput=()=>{const q=$('adminSearch').value.toLowerCase();document.querySelectorAll('.adminLine').forEach(e=>e.style.display=e.dataset.name.includes(q)?'grid':'none')}}
function exportCSV(rows,head){const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='skladiste-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
loginView();
</script></body></html>
